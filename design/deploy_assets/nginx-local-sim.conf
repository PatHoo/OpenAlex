# WSL 本地模拟云端部署：/etc/nginx/sites-available/openalex-local
# 与 nginx-openalex.conf 行为一致，差异：HTTP 8080（无证书）、下载直出本地文件（非 COS）、
# 地图 Key 由本地环境变量 TMAP_KEY 注入（sub_filter 占位符替换为实际值）。

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/openalex;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # sharecode 出现在 query：不写 access log
    location = /login {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location = /logout {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 下载：门禁鉴权后直出本地文件（生产是 302 到 COS/CDN 签名 URL）
    location /web/download/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_buffering off;
    }

    # Demo 平台：门禁 + 地图 Key 响应时注入
    location /web/ {
        auth_request /_auth;
        error_page 401 = @need_login;

        sub_filter '"Please apply for your own key at Tencent Location Service open platform and replace this placeholder"' '"TMAP_KEY_VALUE"';
        sub_filter_once on;
        gzip off;

        try_files $uri $uri/ =404;
    }

    location @need_login {
        return 302 /login?next=$uri;
    }

    # 公开区：自助抓取工具（无项目数据）
    # 注入横幅引导进入第二期 DEMO（仅本地模拟；线上由项目负责人单独分发入口）
    location / {
        add_header Cache-Control "no-store" always;
        sub_filter '<div class="app">' '<div style="background:#0f172a;color:#e2e8f0;padding:12px 20px;font:14px/1.6 -apple-system,Segoe UI,Microsoft YaHei,sans-serif;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-weight:700">OpenAlex 科研分析平台</span><span style="opacity:.7">· 第二期 DEMO（统计分析 / 空间流向 / DID / 文献 / 客户维度）</span><a href="/web/index.html" style="margin-left:auto;background:#2563eb;color:#fff;text-decoration:none;padding:7px 16px;border-radius:6px;font-weight:600">进入第二期 DEMO →</a><span style="opacity:.6">测试分享码 LocalTest2026</span></div><div class="app">';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }
}
