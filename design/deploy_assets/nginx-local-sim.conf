# WSL 本地模拟云端部署：/etc/nginx/sites-available/openalex-local
# 与 nginx-openalex.conf 行为一致，差异：HTTP 8080（无证书）、下载直出本地文件（非 COS）、
# 地图 Key 由本地环境变量 TMAP_KEY 注入（sub_filter 占位符替换为实际值）。

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/openalex;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # sharecode 出现在 query：不写 access log
    location = /login {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location = /logout {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 下载：门禁鉴权后直出本地文件（生产是 302 到 COS/CDN 签名 URL）
    location /web/download/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_buffering off;
    }

    # Demo 平台：门禁 + 地图 Key 响应时注入
    location /web/ {
        auth_request /_auth;
        error_page 401 = @need_login;

        sub_filter '"Please apply for your own key at Tencent Location Service open platform and replace this placeholder"' '"TMAP_KEY_VALUE"';
        sub_filter_once on;
        gzip off;

        try_files $uri $uri/ =404;
    }

    location @need_login {
        return 302 /login?next=$uri;
    }

    # 公开区：自助抓取工具（无项目数据）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
