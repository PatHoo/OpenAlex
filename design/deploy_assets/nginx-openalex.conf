# /etc/nginx/conf.d/openalex.conf
# 部署时替换：demo.example.com（server_name 与证书路径）、TMAP_KEY_PLACEHOLDER

server {
    listen 80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demo.example.com;

    ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/openalex;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- sharecode ----------
    # 关闭日志：分享码出现在 query string 里，不能写进 access log
    location = /login {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location = /logout {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    # auth_request 内部子请求
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------- 下载：鉴权后 302 到 CDN 签名 URL ----------
    # platform.html 在 /web/ 下，相对链接 download/... 解析到 /web/download/
    location /web/download/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------- Demo ----------
    location /web/ {
        auth_request /_auth;
        error_page 401 = @need_login;

        # 地图 Key 响应时注入；仓库前端文件仍保留占位符
        sub_filter '"Please apply for your own key at Tencent Location Service open platform and replace this placeholder"' 'TMAP_KEY_PLACEHOLDER';
        sub_filter_once on;
        sub_filter_types text/html;
        gzip off;

        try_files $uri $uri/ =404;
    }

    location @need_login {
        return 302 /login?next=$uri;
    }

    # ---------- 自助抓取工具（公开，无项目数据）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
